name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Falha cedo e mostra o que o runner realmente enxergou
      - name: Conferir arquivos na raiz
        run: |
          ls -la
          test -f settings.gradle.kts || { echo "::error::settings.gradle.kts não está na raiz do repositório"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Instala o Gradle 9.4.1 (mesma versão do gradle-wrapper.properties),
      # então NÃO precisa de gradlew nem de gradle-wrapper.jar
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.4.1

      - name: Build ARM64 Debug APK
        run: gradle assembleArm64Debug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-arm64-debug
          path: app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
